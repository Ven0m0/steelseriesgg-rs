default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-dependabot
      - id: check-github-actions
      - id: check-github-workflows
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --locked --all-features --fix --allow-no-vcs -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-test
        name: cargo test
        entry: cargo test --locked
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-fix
        name: cargo fix
        entry: cargo fix --workspace --allow-no-vcs
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
      - id: profile-gui-selftest
        name: profile-gui selftest
        entry: node tools/profile-gui/selftest.mjs
        language: system
        files: ^(tools/profile-gui/|src/devices/)
        pass_filenames: false
