[package]
name = "steelseries-gg-linux"
version = "0.1.2"
description = "A complete open-source SteelSeries GG replacement for Linux - RGB lighting, audio mixer, and GameSense support"
repository = "https://github.com/Ven0m0/steelseriesgg-rs"
readme = "README.md"
license = "MIT"
edition = "2024"
rust-version = "1.97.1"
keywords = ["steelseries", "rgb", "gaming", "linux", "audio"]
categories = ["hardware-support", "games"]

[lib]
name = "steelseries_gg"
path = "src/lib.rs"

[[bin]]
name = "ssgg"
path = "src/main.rs"

# Discovery and diagnostics binaries
[[bin]]
name = "discover_actuation"
path = "src/bin/discover_actuation.rs"

[[bin]]
name = "sonar_control"
path = "src/bin/sonar_control.rs"
required-features = ["sonar"]

[features]
default = []
audio = ["dep:libpulse-binding"]
sonar = ["dep:reqwest"]
experimental-apex-2023 = []

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
# HTTP server for GameSense API
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "http2", "json"] }

# Date/time for diagnostic timestamps
chrono = { version = "0.4.45", features = ["serde"] }

# CLI
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"

# Configuration
directories = "6.0.0"
# hidapi is configured per-platform — see [target.*] sections below

# Terminal UI
indicatif = "0.18.6"
libc = "0.2.189" # For root permission checks (geteuid)
libpulse-binding = { version = "2.30.1", optional = true }
parking_lot = "0.12.5"

# HTTP client for Sonar API (optional, only needed for sonar feature)
reqwest = { version = "0.13.4", features = ["json"], optional = true }
rustix = { version = "1.1.4", features = ["process"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smallvec = { version = "1.15.2", features = ["serde"] }

# System information for diagnostics
sysinfo = "0.39.6"
tabled = "0.21.0"

# Error handling
thiserror = "2.0.20"
# Async runtime - only include needed features to reduce binary size
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "signal", "fs"] }
toml = "1.1.4"
tower-http = { version = "0.7.0", default-features = false, features = ["cors"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "=2.6.6", default-features = false, features = ["linux-native-basic-udev"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
hidapi = { version = "=2.6.6" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true           # Remove debug symbols
lto = "fat"            # Full link-time optimization across all crates
codegen-units = 1      # Single codegen unit for better optimization
panic = "abort"        # Don't generate unwinding code
opt-level = 3          # Maximum optimization
debug = 0              # No debug info
overflow-checks = false # Disable integer overflow checks in release

[profile.dev]
debug = 0
split-debuginfo = "packed"
opt-level = 0
codegen-units = 256
incremental = true

[profile.release.build-override]
inherits = "release"
opt-level = 0
codegen-units = 256
incremental = true
debug = 0
