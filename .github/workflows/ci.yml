name: CI

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        features:
          - ""
          - "--features sonar"
          - "--features audio"
          - "--features remap"
          - "--features desktop"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: clippy

      - name: Install audio dependencies (for audio feature)
        if: contains(matrix.features, 'audio')
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev

      - name: Install desktop dependencies (for desktop feature)
        if: contains(matrix.features, 'desktop')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}

      - name: Run clippy
        run: cargo clippy --all-targets --locked ${{ matrix.features }} -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        features:
          - ""
          - "--features sonar"
          - "--features remap"
          - "--features desktop"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0

      - name: Install desktop dependencies (for desktop feature)
        if: contains(matrix.features, 'desktop')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}

      - name: Run tests
        run: cargo test --locked ${{ matrix.features }}

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked

  profile-gui:
    name: Profile GUI selftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run selftest
        run: node tools/profile-gui/selftest.mjs

  # A minifier bump (Renovate groups oxc, lightningcss and minify-html) can compile and still emit JS that
  # behaves differently; this runs the selftest against the minified files build.rs writes for `ssgg-gui`.
  profile-gui-minified:
    name: Profile GUI selftest (minified)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: minified-gui
      - name: Run selftest against the minified files
        run: |
          out_dir=$(cargo check --locked --features desktop --message-format=json \
            | jq -r 'select(.reason == "build-script-executed" and (.package_id | test("steelseries"))) | .out_dir' \
            | tail -1)
          test -f "$out_dir/app.js"
          SSGG_GUI_DIR="$out_dir" node tools/profile-gui/selftest.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        features:
          - ""
          - "--features sonar"
          - "--features audio"
          - "--features remap"
          - "--features desktop"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0

      - name: Install audio dependencies (for audio feature)
        if: contains(matrix.features, 'audio')
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev

      - name: Install desktop dependencies (for desktop feature)
        if: contains(matrix.features, 'desktop')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}

      - name: Build release binary
        run: cargo build --release --locked ${{ matrix.features }}

      - name: Check binary exists
        run: test -f target/release/ssgg

  # Single required status check for branch protection: fails if any job above failed or was cancelled.
  ci-ok:
    name: CI OK
    if: always()
    needs: [fmt, clippy, test, test-windows, profile-gui, profile-gui-minified, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq 'failure|cancelled'; then exit 1; fi
