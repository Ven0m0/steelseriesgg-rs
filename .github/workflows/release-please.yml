name: Release

# Maintains CHANGELOG.md and the crate version from Conventional Commits.
# On every push to main it opens or updates a release pull request.  When
# the release PR is merged the googleapis/release-please-action creates a
# tag and GitHub Release; the build jobs below are gated on the action's
# `release_created` output and attach the built binaries to that release.
#
# Everything lives in one workflow so no cross-workflow triggering (which
# would require a PAT — GITHUB_TOKEN events cannot start other workflows).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (if missing) and upload binaries to (e.g., v0.1.3). Leave empty to run release-please only.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    name: Release please
    if: ${{ github.event_name == 'push' || github.event.inputs.tag == '' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  create-tag:
    name: Create tag and release
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create tag and release if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  build-linux:
    name: Build Linux / Arch x86_64
    needs: [release-please, create-tag]
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || needs.create-tag.outputs.tag_name != '') }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git rust systemd github-cli
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.create-tag.outputs.tag_name || needs.release-please.outputs.tag_name }}
      - name: Create unprivileged build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
      - name: Build via PKGBUILD
        run: |
          PKGVER=$(sed -n 's/^pkgver=\([^ ]*\).*/\1/p' PKGBUILD | head -n1)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive \
            --format=tar \
            --prefix="steelseriesgg-rs-${PKGVER}/" \
            --output="ssgg-${PKGVER}.tar" \
            HEAD
          gzip -n "ssgg-${PKGVER}.tar"
          su - builder -c "cd \"$GITHUB_WORKSPACE\" && SRCDEST=\"$GITHUB_WORKSPACE\" makepkg -sCf --noconfirm"
      - name: Rename package and clean artifacts
        run: |
          rm -f ssgg-debug-*.pkg.tar.zst
          mv ssgg-[0-9]*-x86_64.pkg.tar.zst ssgg-linux-x86_64.pkg.tar.zst
      - name: Compute SHA-256
        run: |
          sha256sum ssgg-linux-x86_64.pkg.tar.zst > sha256sums-linux.txt
          cat sha256sums-linux.txt
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-tag.outputs.tag_name || needs.release-please.outputs.tag_name }}" \
            ssgg-linux-x86_64.pkg.tar.zst \
            sha256sums-linux.txt \
            --clobber

  build-windows:
    name: Build Windows x86_64
    needs: [release-please, create-tag]
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || needs.create-tag.outputs.tag_name != '') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-tag.outputs.tag_name || needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked
      - name: Copy binary and compute SHA-256
        shell: pwsh
        run: |
          Copy-Item target\release\ssgg.exe ssgg-windows-x86_64.exe
          $hash = (Get-FileHash ssgg-windows-x86_64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ssgg-windows-x86_64.exe" | Out-File -Encoding ascii sha256sums-windows.txt
          Get-Content sha256sums-windows.txt
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "${{ needs.create-tag.outputs.tag_name || needs.release-please.outputs.tag_name }}" ssgg-windows-x86_64.exe sha256sums-windows.txt --clobber
