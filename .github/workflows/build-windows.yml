name: Build Windows

on:
  workflow_dispatch:
    inputs:
      features:
        description: "Cargo feature flags (e.g. --features sonar; --features desktop also builds ssgg-gui.exe)"
        required: false
        default: ""
      target_cpu:
        description: "-Ctarget-cpu: x86-64 (runs on any x86-64 CPU) or x86-64-v3 (AVX2; Haswell / Zen 1 and newer)"
        required: false
        default: "x86-64"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.event.inputs.target_cpu }}

      - name: Build release binary
        # RUSTFLAGS overrides the x86-64-v3 default in .cargo/config.toml.
        env:
          RUSTFLAGS: -Ctarget-cpu=${{ github.event.inputs.target_cpu }}
        run: cargo build -r --locked ${{ github.event.inputs.features }}

      - name: Verify binary exists
        run: Test-Path target\release\ssgg.exe
        shell: pwsh

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash target\release\ssgg.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ssgg.exe" | Out-File -Encoding ascii sha256sums.txt
          Get-Content sha256sums.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ssgg-windows-x86_64
          path: |
            target\release\ssgg.exe
            target\release\ssgg-gui.exe
            sha256sums.txt
          retention-days: 30
